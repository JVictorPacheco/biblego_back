swagger: "2.0"
info:
  title: API de Usuários
  description: API para gerenciamento de usuários
  version: "1.0"
basePath: /api
schemes:
  - http
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: >-
      Insira o token JWT no formato: `Bearer {seu_token}`.
      Obtenha o token através do endpoint de login.


